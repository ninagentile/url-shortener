[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "url-shortener"
version = "0.1.0"
description = "Python command line tool that performs URL shortening and expansion."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nicole Gentile", email = "nicole.gentile@adcube.ai" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pydantic>=2.9, <2.10",
    "mongomock",
    "mongoengine",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
