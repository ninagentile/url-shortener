[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "url-shortener"
version = "0.1.0"
description = "Python command line tool that performs URL shortening and expansion."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nicole Gentile", email = "nicole.gentile@adcube.ai" }]
dependencies = [
    "pydantic>=2.9, <2.10",
    "mongoengine",
    # imported directly by main.py
    "pymongo>=4, <5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mongomock",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# main.py lives in the project root, outside src/
pythonpath = ["."]

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py311"
